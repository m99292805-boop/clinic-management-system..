name: 🏥 Clinic Android Build & Release

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write   # مطلوب لإنشاء GitHub Release

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

env:
  API_LEVEL: "34"
  BUILD_TOOLS: "34.0.0"
  NODE_VERSION: "20"
  JAVA_VERSION: "17"
  ANDROID_DIR: android

jobs:
  build:
    name: 🔨 Build APK + AAB
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🟢 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: ☕ Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: 🗄️ Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-${{ env.API_LEVEL }} build-tools;${{ env.BUILD_TOOLS }}"
          cmdline-tools-version: 11076708
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: 🔧 Export & validate Android env
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK"     >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/platform-tools"   >> "$GITHUB_PATH"
          test -d "$SDK/platforms/android-${API_LEVEL}"  || { echo "❌ platform missing"; exit 1; }
          test -d "$SDK/build-tools/${BUILD_TOOLS}"      || { echo "❌ build-tools missing"; exit 1; }
          echo "✅ Android SDK OK"

      - name: 📦 Install dependencies (retry x3)
        run: |
          set -eo pipefail
          for i in 1 2 3; do
            echo "▶ attempt $i"
            if [ -f package-lock.json ]; then npm ci && break; else npm install && break; fi
            [ "$i" = 3 ] && { echo "❌ npm failed"; exit 1; }
            sleep 5
          done

      - name: 🏗️ Build web (Vite)
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          npm run build
          test -f dist/index.html || { echo "❌ dist/index.html missing"; exit 1; }

      - name: 🔄 Capacitor sync
        run: |
          set -euo pipefail
          [ -d "$ANDROID_DIR" ] || npx cap add android
          npx cap sync android

      - name: 🔐 chmod gradlew
        run: chmod +x "$ANDROID_DIR/gradlew"

      - name: 🧹 Gradle clean
        working-directory: ${{ env.ANDROID_DIR }}
        run: ./gradlew clean --no-daemon --stacktrace

      - name: 🐞 Build APK (debug)
        working-directory: ${{ env.ANDROID_DIR }}
        run: |
          for i in 1 2; do
            ./gradlew assembleDebug --no-daemon --stacktrace && exit 0
            echo "⚠️ attempt $i failed"; sleep 10
          done
          echo "❌ assembleDebug failed"; exit 1

      - name: 📦 Build AAB (release)
        working-directory: ${{ env.ANDROID_DIR }}
        run: |
          for i in 1 2; do
            ./gradlew bundleRelease --no-daemon --stacktrace && exit 0
            echo "⚠️ attempt $i failed"; sleep 10
          done
          echo "❌ bundleRelease failed"; exit 1

      - name: ✍️ Sign AAB (if keystore secrets exist)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          AAB=$(find "$ANDROID_DIR" -name "*.aab" -path "*release*" | head -n1)
          [ -n "$AAB" ] || { echo "❌ AAB not found"; exit 1; }
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "ℹ️ No keystore secrets — AAB left unsigned"; exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          jarsigner -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore "$RUNNER_TEMP/release.jks" \
            -storepass "$KEYSTORE_PASSWORD" -keypass "${KEY_PASSWORD:-$KEYSTORE_PASSWORD}" \
            "$AAB" "$KEY_ALIAS"
          rm -f "$RUNNER_TEMP/release.jks"
          echo "✅ AAB signed"

      - name: ✅ Verify outputs
        run: |
          set -euo pipefail
          mkdir -p out
          APK=$(find "$ANDROID_DIR" -name "*.apk" -path "*debug*" | head -n1)
          AAB=$(find "$ANDROID_DIR" -name "*.aab" -path "*release*" | head -n1)
          [ -n "$APK" ] && [ -s "$APK" ] || { echo "❌ APK missing/empty"; exit 1; }
          [ -n "$AAB" ] && [ -s "$AAB" ] || { echo "❌ AAB missing/empty"; exit 1; }
          unzip -tq "$APK" >/dev/null || { echo "❌ APK corrupt"; exit 1; }
          unzip -tq "$AAB" >/dev/null || { echo "❌ AAB corrupt"; exit 1; }
          cp "$APK" out/clinic-debug.apk
          cp "$AAB" out/clinic-release.aab
          ls -lh out

      - name: ☁️ Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: clinic-android-${{ github.run_number }}
          path: out/*
          if-no-files-found: error
          retention-days: 30

      - name: 📝 Release notes
        run: |
          {
            echo "## 🏥 Clinic App — Build #${{ github.run_number }}"
            echo ""
            echo "- 🔖 **Commit:** \`${{ github.sha }}\`"
            echo "- 🌿 **Branch:** \`${{ github.ref_name }}\`"
            echo "- 📅 **Build date:** $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo "- 💬 **Message:** $(git log -1 --pretty=%s)"
          } > release_notes.md

      - name: 🚀 Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: "Release v${{ github.run_number }}"
          body_path: release_notes.md
          files: |
            out/clinic-debug.apk
            out/clinic-release.aab
          fail_on_unmatched_files: true
          target_commitish: ${{ github.sha }}
